# Deploys to the home server over Tailscale. Replace every HOME_SERVER /
# TAILNET / BACKUP_* placeholder before the first deploy; see README.md.
service: food_storage_inventory
image: food_storage_inventory

servers:
  web:
    - HOME_SERVER

# Tailscale Serve terminates HTTPS (required for the PWA and push
# notifications) and forwards to kamal-proxy on localhost. kamal-proxy is
# shared by every Kamal app on the server; its ports stay off 80/443, which
# other services on the home server may already use.
proxy:
  ssl: false
  host: HOME_SERVER.TAILNET.ts.net
  run:
    http_port: 8380
    https_port: 8743
    bind_ips:
      - 127.0.0.1

# Kamal runs a local registry and forwards it to the server over SSH.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
  clear:
    # Runs Solid Queue (and its recurring jobs) inside Puma.
    SOLID_QUEUE_IN_PUMA: true
    VAPID_SUBJECT: https://HOME_SERVER.TAILNET.ts.net

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "food_storage_inventory_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  # Continuously replicates the production database over SFTP to another
  # machine on the tailnet, keeping daily snapshots for 30 days.
  litestream:
    image: litestream/litestream:0.5.17
    host: HOME_SERVER
    cmd: replicate
    files:
      - config/litestream.yml:/etc/litestream.yml
    volumes:
      - "food_storage_inventory_storage:/rails/storage"
      # Holds the SSH private key (id_ed25519) for the backup machine.
      - "/etc/food_storage_inventory/litestream:/etc/litestream/ssh:ro"
    env:
      clear:
        BACKUP_HOST: BACKUP_MACHINE.TAILNET.ts.net:22
        BACKUP_USER: BACKUP_USER
        BACKUP_PATH: /path/to/backups/food_storage_inventory
        BACKUP_HOST_KEY: "ssh-ed25519 BACKUP_MACHINE_HOST_KEY"
