<% require File.expand_path(".kamal/credentials") %>
# Deploys to the home server over Tailscale. Server names and backup settings
# come from Rails credentials (see README.md) so they stay out of the repo.
service: food_storage_inventory
image: food_storage_inventory

servers:
  web:
    - <%= KAMAL_CREDENTIALS.dig(:deploy, :server) %>

ssh:
  user: <%= KAMAL_CREDENTIALS.dig(:deploy, :ssh_user) %>

# Tailscale Serve terminates HTTPS (required for the PWA and push
# notifications) and forwards to kamal-proxy on localhost. kamal-proxy is
# shared by every Kamal app on the server, and staying on localhost ports
# keeps 80/443 free for other services.
proxy:
  ssl: false
  host: <%= KAMAL_CREDENTIALS.dig(:deploy, :host) %>
  run:
    http_port: 8380
    https_port: 8743
    bind_ips:
      - 127.0.0.1

# Kamal runs a local registry and forwards it to the server over SSH.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Runs Solid Queue (and its recurring jobs) inside Puma.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "food_storage_inventory_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

<% if KAMAL_CREDENTIALS.litestream %>
accessories:
  # Continuously replicates the production database over SFTP to another
  # machine on the tailnet, keeping daily snapshots for 30 days.
  litestream:
    image: litestream/litestream:0.5.17
    host: <%= KAMAL_CREDENTIALS.dig(:deploy, :server) %>
    cmd: replicate
    files:
      - config/litestream/litestream.yml.erb:/etc/litestream.yml
      - local: config/litestream/id_ed25519.erb
        remote: /etc/litestream/id_ed25519
        mode: "0600"
    volumes:
      - "food_storage_inventory_storage:/rails/storage"
<% end %>
