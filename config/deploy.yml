<% require File.expand_path(".kamal/credentials") %>
# Deploys to the home server over Tailscale. Server names and backup settings
# come from Rails credentials (see README.md) so they stay out of the repo.
service: food_storage_inventory
image: food_storage_inventory

servers:
  web:
    - <%= KAMAL_CREDENTIALS.dig(:deploy, :server) %>

ssh:
  user: <%= KAMAL_CREDENTIALS.dig(:deploy, :ssh_user) %>

# The tailscale accessory terminates HTTPS (required for the PWA and push
# notifications) under its own *.ts.net name and forwards to kamal-proxy on
# localhost, which routes by that name. kamal-proxy is shared by every Kamal
# app on the server, so these settings must match the other apps'.
proxy:
  ssl: false
  host: <%= KAMAL_CREDENTIALS.dig(:deploy, :host) %>
  run:
    http_port: 8380
    https_port: 8743
    bind_ips:
      - 127.0.0.1

# Kamal runs a local registry and forwards it to the server over SSH.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Runs Solid Queue (and its recurring jobs) inside Puma.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "food_storage_inventory_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  # A Tailscale node of its own gives the app a separate *.ts.net name and
  # HTTPS certificate, so it doesn't share an origin (cookies, service worker)
  # with other apps on the server. Host networking lets it reach kamal-proxy
  # on localhost.
  tailscale:
    image: tailscale/tailscale:v1.104.2
    host: <%= KAMAL_CREDENTIALS.dig(:deploy, :server) %>
    network: host
    env:
      secret:
        - TS_AUTHKEY
      clear:
        TS_HOSTNAME: <%= KAMAL_CREDENTIALS.dig(:deploy, :host).to_s.split(".").first %>
        TS_STATE_DIR: /var/lib/tailscale
        TS_SERVE_CONFIG: /config/serve.json
        # Userspace networking needs no access to the host's network devices,
        # and an automatic port avoids the host's own tailscaled.
        TS_USERSPACE: true
        TS_TAILSCALED_EXTRA_ARGS: --port=0
    files:
      - config/tailscale/serve.json:/config/serve.json
    volumes:
      - "food_storage_inventory_tailscale:/var/lib/tailscale"

<% if KAMAL_CREDENTIALS.litestream %>
  # Continuously replicates the production database to Cloudflare R2, keeping
  # daily snapshots for 30 days. On a server without a database, it first
  # restores the latest backup (config/litestream/start.sh).
  litestream:
    image: litestream/litestream:0.5.17
    host: <%= KAMAL_CREDENTIALS.dig(:deploy, :server) %>
    cmd: /etc/litestream/start.sh
    options:
      entrypoint: /bin/sh
    files:
      - config/litestream/litestream.yml.erb:/etc/litestream.yml
      - config/litestream/start.sh:/etc/litestream/start.sh
    volumes:
      - "food_storage_inventory_storage:/rails/storage"
<% end %>
